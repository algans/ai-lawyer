services:
  app:
    build:
      context: .
      target: dev
    ports:
      # Sabit yerel port (run.sh içinde WEB_PORT olarak tanımlı, değişmez).
      - "${WEB_PORT:-37429}:3000"
    environment:
      # Ödeme geri dönüşleri vb. sabit porta işaret etsin.
      - APP_URL=${APP_URL:-http://localhost:37429}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - .env
    depends_on:
      - db
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: hukuki
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
